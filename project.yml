# XcodeGen spec. Morsel.xcodeproj is generated from this and gitignored —
# same philosophy the old React Native ios/ folder had, for the same reason:
# a generated project file has no business being hand-edited or diffed.
#
#   xcodegen generate
#
# DEVELOPMENT_TEAM is committed deliberately. The RN build lost an hour to
# `prebuild --clean` silently wiping the signing team out of the generated
# project; pinning it here means a regenerated project is immediately
# buildable. It is a personal team ID in a private repo, not a secret.

name: Morsel

options:
  bundleIdPrefix: com.rinneso
  deploymentTarget:
    iOS: "26.0" # Liquid Glass and tabBarMinimizeBehavior are iOS 26 APIs
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MorselCore:
    path: MorselCore

targets:
  Morsel:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      # Both products are named explicitly; a bare `package:` entry would link
      # only the product sharing the package's name.
      - package: MorselCore
        product: MorselCore
      - package: MorselCore
        product: MorselData
      - sdk: HealthKit.framework
    entitlements:
      path: App/Morsel.entitlements
      properties:
        # Allowed on a free personal team — unlike push, which is what broke
        # signing on the React Native build.
        com.apple.developer.healthkit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Morsel
        # Read through from the build settings below rather than left to
        # XcodeGen's defaults, which are 1.0/1 and silently won the argument —
        # the first archive built as 1.0 despite MARKETING_VERSION saying 0.1.0.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Deliberately NOT carrying over UIBackgroundModes: ["audio"] from the
        # RN app. That was a workaround for JS timers being suspended in the
        # background; this timer derives every duration from the wall clock, so
        # backgrounding costs nothing and the hack (an App Store rejection
        # risk) is no longer needed.
        #
        # Read-only: Morsel charts weight recorded elsewhere and does not write
        # back. Camera and the HealthKit *write* permission arrive if and when
        # something actually needs them.
        NSHealthShareUsageDescription: >-
          Morsel reads your weight history from Health so it can chart your
          trend alongside your meals.
        # Required even though nothing writes to Health: App Store Connect
        # rejects any build carrying the HealthKit entitlement unless *both*
        # purpose strings are present, regardless of which APIs are called.
        # The string is only ever surfaced if the app asks for write access,
        # which it does not — so it says so rather than promising a feature.
        NSHealthUpdateUsageDescription: >-
          Morsel does not write to Health. It only reads your weight history
          to chart your trend.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rinneso.morsel
        PRODUCT_NAME: Morsel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. XcodeGen defaults to iPhone+iPad, and App Store Connect
        # then rejects the build: an iPad target must declare all four
        # orientations for multitasking, which would undo the deliberate
        # portrait lock below. This is a phone-on-the-table app — the Duo is
        # still an iPhone, so nothing about #15 needs iPad here.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: K7Z55FU8AF
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
